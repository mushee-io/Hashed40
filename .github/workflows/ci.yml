name: Hashed CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ultra-contract:
    name: Ultra contract integration
    runs-on: ubuntu-latest
    container:
      image: quay.io/ultra.io/3rdparty-devtools:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ultra's current 3rdparty-devtools:latest image ships Node 22, while the
      # bundled ultratest/esm runtime currently crashes on Node 22. Use Node 18
      # for ultratest until the upstream image updates that dependency.
      - name: Node 18 for UltraTest compatibility
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Compile and test on Ultra local chain
        run: bash scripts/test_ultra.sh

      - name: Upload Hashed40 contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hashed40-ultra-contract
          path: |
            contract/build/hashedpad.wasm
            contract/build/hashedpad.abi
          if-no-files-found: error

  web:
    name: Web launcher build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build
        run: npm run build